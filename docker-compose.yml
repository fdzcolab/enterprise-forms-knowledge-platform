services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    environment:
      POSTGRES_DB: enterprise_forms
      POSTGRES_USER: enterprise
      POSTGRES_PASSWORD: enterprise
    ports: ["5432:5432"]
    volumes: ["enterprise_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterprise -d enterprise_forms"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports: ["6333:6333", "6334:6334"]
    volumes: ["enterprise_qdrant:/qdrant/storage"]

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://enterprise:enterprise@postgres:5432/enterprise_forms?schema=public
      QDRANT_URL: http://qdrant:6333
    ports: ["3100:3100"]
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_started }

volumes:
  enterprise_pg:
  enterprise_qdrant:
